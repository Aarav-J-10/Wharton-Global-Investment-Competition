# Live research run: acquire a hash-sealed snapshot (SEC EDGAR, Yahoo Finance,
# Wikipedia), run the screen + walk-forward backtest offline from it, verify the
# screen reproduces byte-for-byte, then commit snapshot + outputs to the branch.
name: research-run
on:
  workflow_dispatch:
    inputs:
      cutoff:
        description: 'Cutoff date YYYY-MM-DD (blank = last completed NYSE session)'
        required: false
  schedule:
    - cron: '17 23 1-7 * 1-5'   # first weekday evening of each month (UTC)
permissions:
  contents: write
concurrency: research-run
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # SEC fair-access policy requires a contact; set the WIC_SEC_USER_AGENT
      # repository secret to "Your Name your@email". Never written to artifacts.
      WIC_SEC_USER_AGENT: ${{ secrets.WIC_SEC_USER_AGENT || format('WIC-S003 research {0}@users.noreply.github.com', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Acquire snapshot
        run: python -m wic acquire ${{ inputs.cutoff && format('--cutoff {0}', inputs.cutoff) || '' }} --cache .cache/sec
      - name: Screen
        run: python -m wic screen
      - name: Backtest
        run: python -m wic backtest
      - name: Verify reproducibility
        run: python -m wic verify --run "$(ls -d outputs/screen/*/ | tail -1)"
      - name: Commit snapshot and outputs
        run: |
          git config user.name "wic-research-bot"
          git config user.email "wic-research-bot@users.noreply.github.com"
          git add data/snapshots outputs
          git commit -m "research run: $(ls data/snapshots | tail -1) [skip ci]" || echo "nothing to commit"
          git push
